name: Feature request
description: Suggest a capability or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution. Small, focused requests are easier to
        evaluate than broad redesigns.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Driftalytics does not support today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The API, CLI, or behavior you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other designs you considered.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Monitors
        - Runner and streaming
        - Damage prediction
        - LLM evaluation
        - CLI
        - Docs
        - Packaging
        - Other
    validations:
      required: true
