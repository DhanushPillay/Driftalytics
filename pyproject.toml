[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "driftalytics"
dynamic = ["version"]
description = "Lightweight ML/LLM drift monitoring with early-warning damage prediction."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Driftalytics contributors" }]
keywords = ["machine-learning", "mlops", "drift", "monitoring", "evaluation", "llm", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
bench = ["pyarrow>=14", "scikit-learn>=1.4"]
dev = [
    "build>=1.2",
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pyarrow>=14",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[project.scripts]
driftalytics = "driftalytics.cli:main"

[project.urls]
Homepage = "https://github.com/DhanushPillay/Driftalytics"
Repository = "https://github.com/DhanushPillay/Driftalytics"
Issues = "https://github.com/DhanushPillay/Driftalytics/issues"
Changelog = "https://github.com/DhanushPillay/Driftalytics/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "driftalytics.version.__version__" }

[tool.setuptools.package-data]
driftalytics = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["driftalytics"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
